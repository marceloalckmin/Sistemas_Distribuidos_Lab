services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${PORT_API}:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      DATABASE_URL: postgresql+psycopg://$${POSTGRES_USER:-app}:$${POSTGRES_PASSWORD:-app}@$${POSTGRES_HOST:-db}:5432/$${POSTGRES_DB:-app}
    volumes:
      - ./backend/app: app/app
    depends_on:
      - db:
        condition: service-healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB:${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-app} -d $${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  
  volumes:
    postgres_data: